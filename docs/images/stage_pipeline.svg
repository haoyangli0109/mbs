<svg xmlns="http://www.w3.org/2000/svg" width="790" height="512" viewBox="0 0 790 512" font-family="'Noto Sans SC','Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="一个 stage 的数据怎么流过两个段，256×256 tile，PF 为 2，PF_B 为 1。每行一种数据，从左到右是时间：step s−2 段 1 发 stage s 的 A 和 A scale DMA，写进 LDS 槽 s%4；step s−1 段 0 发 stage s 的 B 和 B scale，写进 bf[s%4] 和 bs[s%4]；step s−1 段 1 开头等 A(s) 到齐并 barrier，再读 stage s 的 mi 0 到 7 和 scale 块 0 到 3，进 afr0 和 asc0；step s 段 0 开头等 B(s)，算 stage s 的 mi 0 到 7，同时读 mi 8 到 15 和 scale 块 4 到 7，进 afr1 和 asc1；step s 段 1 算 stage s 的 mi 8 到 15">
<rect width="790" height="512" fill="#ffffff"/>
<text x="14" y="20" font-size="15" fill="#111827" text-anchor="start" dominant-baseline="central" font-weight="600">一个 stage 的数据怎么流过两个段：A、A scale、B、B scale、A 片段、MFMA</text>
<text x="14" y="43" font-size="12" fill="#6b7280" text-anchor="start" dominant-baseline="central">256×256 tile，PF = 2、PF_B = 1。每行一种数据，从左到右是时间；蓝色是 stage s 自己的数据，灰色是同一时刻别的 stage</text>
