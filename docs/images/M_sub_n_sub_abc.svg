<text x="14" y="20" font-size="15" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="600">C 的 tile 要用 A、B 的哪部分</text>
<text x="14" y="42" font-size="12" fill="#6b7280" text-anchor="start" dominant-baseline="middle">M = N = 8192，K = 5120，按比例画</text>
<text x="30" y="62" font-size="12" fill="#111827" text-anchor="start" dominant-baseline="middle">WG 9 的第一个 tile，和它要读的 A、B</text>
<text x="92" y="158" font-size="14" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">C = A × Bᵀ</text>
<text x="92" y="280" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">第 1280–1535 行</text>
<text x="92" y="318" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">A（M×K）</text>
<text x="92" y="338" font-size="12" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">8192×5120</text>
<text x="178" y="116" font-size="12" fill="#111827" text-anchor="start" dominant-baseline="middle">B 的第 0–255 行</text>
<text x="260" y="150" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">Bᵀ（K×N）</text>
<text x="260" y="170" font-size="12" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">5120×8192</text>
<text x="178" y="263" font-size="12" fill="#111827" text-anchor="start" dominant-baseline="middle">WG 9 的 tile（m5, n0）</text>
<text x="260" y="316" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">C（M×N）</text>
<text x="260" y="336" font-size="12" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">8192×8192</text>
<text x="404" y="20" font-size="15" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="600">放大到一个 stage</text>
<text x="404" y="42" font-size="12" fill="#6b7280" text-anchor="start" dominant-baseline="middle">K 只取 256 个，按 MFMA 片段切开</text>
<text x="420" y="62" font-size="12" fill="#111827" text-anchor="start" dominant-baseline="middle">wave 1 的 acc[5][2]，和它用的 A、B 片段</text>
<text x="583" y="169" font-size="12" fill="#111827" text-anchor="end" dominant-baseline="middle" font-weight="600">Bᵀ（本 stage）</text>
<text x="583" y="187" font-size="12" fill="#111827" text-anchor="end" dominant-baseline="middle">16 个片段</text>
<text x="583" y="205" font-size="12" fill="#111827" text-anchor="end" dominant-baseline="middle">每个 wave 4 个 = NSUB</text>
<text x="503.5" y="252" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">A 由 4 个 wave 共用（LDS）</text>
<text x="503.5" y="452" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">A：16 个片段 = MSUB</text>
<text x="680.5" y="452" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">C 的 tile：16×16 个子块</text>
</svg>
