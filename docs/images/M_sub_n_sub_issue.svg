<svg xmlns="http://www.w3.org/2000/svg" width="790" height="640" viewBox="0 0 790 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="时序图：wave 的指令流把 MFMA 和 load 按顺序交给 SQ 发射；load 交给访存单元后 SQ 不等它，继续发 MFMA；数据回来后 vmcnt 减 1；s_waitcnt 确认完成后，用这批数据的 MFMA 才发出">
<rect width="790" height="640" fill="#ffffff"/>
<text x="14" y="22" font-size="15" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="600">一条 load 从发出到能用</text>
<text x="14" y="44" font-size="12" fill="#6b7280" text-anchor="start" dominant-baseline="middle">从上往下是时间；实线是交出去，虚线是回报（能接下一条、数据到了）</text>
<rect x="25" y="70" width="150" height="34" fill="#f3f4f6" stroke="#111827" stroke-width="1" rx="4"/>
<text x="100" y="87" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">wave 的指令流</text>
<line x1="100" y1="104" x2="100" y2="616" stroke="#d1d5db" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="205" y="70" width="150" height="34" fill="#f3f4f6" stroke="#111827" stroke-width="1" rx="4"/>
<text x="280" y="87" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">SQ 发射口</text>
<line x1="280" y1="104" x2="280" y2="616" stroke="#d1d5db" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="395" y="70" width="150" height="34" fill="#f3f4f6" stroke="#111827" stroke-width="1" rx="4"/>
<text x="470" y="87" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">矩阵单元</text>
<line x1="470" y1="104" x2="470" y2="616" stroke="#d1d5db" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="575" y="70" width="150" height="34" fill="#f3f4f6" stroke="#111827" stroke-width="1" rx="4"/>
<text x="650" y="87" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="600">访存单元</text>
<line x1="650" y1="104" x2="650" y2="616" stroke="#d1d5db" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="770" y="128" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">时间</text>
<line x1="770" y1="140" x2="770" y2="608" stroke="#6b7280" stroke-width="1.0"/>
<polygon points="770,616 766,607 774,607" fill="#6b7280"/>
<line x1="100" y1="150" x2="271" y2="150" stroke="#374151" stroke-width="1.3"/>
<polygon points="280,150 271,145.5 271,154.5" fill="#374151"/>
<rect x="160.52" y="132" width="58.96" height="15" fill="#ffffff"/>
<text x="190" y="140" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">① MFMA 1</text>
<line x1="280" y1="184" x2="461" y2="184" stroke="#374151" stroke-width="1.3"/>
<polygon points="470,184 461,179.5 461,188.5" fill="#374151"/>
<rect x="293.44" y="166" width="163.12" height="15" fill="#ffffff"/>
<text x="375" y="174" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">发出，矩阵单元忙约 16 周期</text>
<line x1="100" y1="218" x2="271" y2="218" stroke="#374151" stroke-width="1.3"/>
<polygon points="280,218 271,213.5 271,222.5" fill="#374151"/>
<rect x="140.72" y="200" width="98.56" height="15" fill="#ffffff"/>
<text x="190" y="208" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">② load 下一批 B</text>
<line x1="280" y1="252" x2="641" y2="252" stroke="#374151" stroke-width="1.3"/>
<polygon points="650,252 641,247.5 641,256.5" fill="#374151"/>
<rect x="378.76" y="234" width="172.48" height="15" fill="#ffffff"/>
<text x="465" y="242" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">发出，vmcnt 加 1，SQ 不等它</text>
<rect x="573.44" y="274" width="153.12" height="24" fill="#fef9c3" stroke="#d6d3d1" stroke-width="1" rx="3"/>
<text x="650" y="286" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">后台去 L2 或显存取数据</text>
<line x1="100" y1="320" x2="271" y2="320" stroke="#374151" stroke-width="1.3"/>
<polygon points="280,320 271,315.5 271,324.5" fill="#374151"/>
<rect x="160.52" y="302" width="58.96" height="15" fill="#ffffff"/>
<text x="190" y="310" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">③ MFMA 2</text>
<line x1="470" y1="354" x2="289" y2="354" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
<polygon points="280,354 289,349.5 289,358.5" fill="#6b7280"/>
<rect x="299.44" y="336" width="151.12" height="15" fill="#ffffff"/>
<text x="375" y="344" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">约 16 周期后可以接下一条</text>
<line x1="280" y1="388" x2="461" y2="388" stroke="#374151" stroke-width="1.3"/>
<polygon points="470,388 461,383.5 461,392.5" fill="#374151"/>
<rect x="337" y="370" width="76" height="15" fill="#ffffff"/>
<text x="375" y="378" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">发出 MFMA 2</text>
<rect x="25" y="410" width="520" height="24" fill="#fef9c3" stroke="#d6d3d1" stroke-width="1" rx="3"/>
<text x="285" y="422" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">中间还有几十条 MFMA，取数据的时间被它们盖住</text>
<line x1="650" y1="456" x2="289" y2="456" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
<polygon points="280,456 289,451.5 289,460.5" fill="#6b7280"/>
<rect x="383.8" y="438" width="162.4" height="15" fill="#ffffff"/>
<text x="465" y="446" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">数据写进 VGPR，vmcnt 减 1</text>
<line x1="100" y1="490" x2="271" y2="490" stroke="#374151" stroke-width="1.3"/>
<polygon points="280,490 271,485.5 271,494.5" fill="#374151"/>
<rect x="118.76" y="472" width="142.48" height="15" fill="#ffffff"/>
<text x="190" y="480" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">④ s_waitcnt vmcnt(0)</text>
<rect x="205" y="512" width="150" height="24" fill="#fef9c3" stroke="#d6d3d1" stroke-width="1" rx="3"/>
<text x="280" y="524" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">计数已降到 0，放行</text>
<line x1="100" y1="558" x2="271" y2="558" stroke="#374151" stroke-width="1.3"/>
<polygon points="280,558 271,553.5 271,562.5" fill="#374151"/>
<rect x="132.92" y="540" width="114.16" height="15" fill="#ffffff"/>
<text x="190" y="548" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">⑤ 用这批 B 的 MFMA</text>
<line x1="280" y1="592" x2="461" y2="592" stroke="#374151" stroke-width="1.3"/>
<polygon points="470,592 461,587.5 461,596.5" fill="#374151"/>
<rect x="358" y="574" width="34" height="15" fill="#ffffff"/>
<text x="375" y="582" font-size="12" fill="#111827" text-anchor="middle" dominant-baseline="middle">发出</text>
<text x="14" y="150" font-size="12" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="600">起点</text>
<text x="14" y="592" font-size="12" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="600">终点</text>
</svg>
